name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev cmake build-essential

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install libsodium cmake

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -DSERCTRL_BUILD_TESTS=ON

      - name: Build
        run: |
          cd build
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Test
        run: |
          cd build
          ./tests/serctrl_tests
